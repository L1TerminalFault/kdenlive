name: Kdenlive Windows Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Kdenlive target: 'master' (git HEAD), 'release' (latest tagged release) or a version such as 25.08.0"
        required: false
        default: "master"
      build_type:
        description: "Build type (RelWithDebInfo matches KDE's prebuilt binary cache; others rebuild every dependency from source and will not fit in the time limit)"
        required: false
        default: "RelWithDebInfo"
        type: choice
        options:
          - RelWithDebInfo
          - Release
          - Debug
      package:
        description: "Also create the Windows installer/archive"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 3 * * 0"   # weekly, Sunday 03:00 UTC

concurrency:
  group: kdenlive-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CRAFT_ROOT: C:\CraftRoot
  KD_TARGET: ${{ github.event.inputs.target || 'master' }}
  KD_BUILD_TYPE: ${{ github.event.inputs.build_type || 'RelWithDebInfo' }}
  KD_PACKAGE: ${{ github.event.inputs.package || 'true' }}

jobs:
  build:
    name: Kdenlive (Windows x64, MSVC 2022, KDE Craft)
    runs-on: windows-2022
    timeout-minutes: 345

    steps:
      - name: Prepare runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          Get-PSDrive C | Format-Table Name, Used, Free

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      # CraftBootstrap.py is exactly what KDE's install_craft.ps1 runs. We call it
      # directly because the .ps1 wrapper has interactive prompts that hang CI.
      # --use-defaults selects: Microsoft Visual Studio 2022, x86_64 (the ABI KDE's
      # binary cache is built for), short-path dir C:\_, default install root.
      - name: Bootstrap Craft
        shell: pwsh
        run: |
          python -m pip install --upgrade certifi
          New-Item -ItemType Directory -Force -Path "$env:CRAFT_ROOT\download" | Out-Null
          $bootstrap = Join-Path $env:RUNNER_TEMP "CraftBootstrap.py"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://invent.kde.org/packaging/craft/-/raw/master/setup/CraftBootstrap.py" `
            -OutFile $bootstrap
          python $bootstrap --prefix "$env:CRAFT_ROOT" --branch master --use-defaults
          if ($LASTEXITCODE -ne 0) { throw "Craft bootstrap failed" }

          $abi = (Select-String -Path "$env:CRAFT_ROOT\etc\CraftSettings.ini" -Pattern '^\s*ABI\s*=').Line
          Write-Host "Craft ABI -> $abi"
          if ($abi -notmatch 'msvc2022') { throw "Unexpected ABI: $abi" }

      - name: Build Kdenlive (dependencies come from KDE's binary cache)
        shell: pwsh
        run: |
          # Save what we need: craftenv.ps1 clears and rebuilds the whole environment.
          $root   = $env:CRAFT_ROOT
          $target = $env:KD_TARGET
          $btype  = $env:KD_BUILD_TYPE
          $vswhereDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $env:PATH = "$vswhereDir;$env:PATH"

          . "$root\craft\craftenv.ps1"

          $opts = @("--ci-mode", "--output-on-failure", "--buildtype", $btype)
          if ($target -ne "release") { $opts += "--target=$target" }

          craft @opts kdenlive
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "First attempt failed - retrying after building zlib (known Kdenlive/Craft quirk)"
            craft @opts zlib
            craft @opts kdenlive
          }
          if ($LASTEXITCODE -ne 0) { throw "craft kdenlive failed ($LASTEXITCODE)" }

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $env:CRAFT_ROOT "bin\kdenlive.exe"
          if (-not (Test-Path $exe)) { throw "kdenlive.exe not found at $exe" }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime
          $melt = Join-Path $env:CRAFT_ROOT "bin\melt.exe"
          if (Test-Path $melt) { & $melt -version 2>&1 | Select-Object -First 3 }

      - name: Package installer
        if: ${{ env.KD_PACKAGE == 'true' }}
        shell: pwsh
        run: |
          $root   = $env:CRAFT_ROOT
          $target = $env:KD_TARGET
          $btype  = $env:KD_BUILD_TYPE
          $vswhereDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $env:PATH = "$vswhereDir;$env:PATH"

          . "$root\craft\craftenv.ps1"

          $opts = @("--ci-mode", "--output-on-failure", "--buildtype", $btype)
          if ($target -ne "release") { $opts += "--target=$target" }

          craft @opts --package kdenlive
          if ($LASTEXITCODE -ne 0) { throw "craft --package failed ($LASTEXITCODE)" }

      # Craft's default package output directory is <CraftRoot>\tmp
      - name: Collect packages
        if: ${{ always() }}
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $tmp = Join-Path $env:CRAFT_ROOT "tmp"
          if (Test-Path $tmp) {
            Get-ChildItem $tmp -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.exe', '.7z', '.zip', '.appx', '.msix' -and $_.Length -gt 1MB } |
              ForEach-Object { Copy-Item $_.FullName $out -Force }
          }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload packages
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-windows-${{ env.KD_TARGET }}-${{ env.KD_BUILD_TYPE }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Craft logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-craft-logs
          path: |
            C:\CraftRoot\etc\CraftSettings.ini
            C:\CraftRoot\logs\**
            C:\CraftRoot\build\**\*.log
          if-no-files-found: ignore
          retention-days: 7
