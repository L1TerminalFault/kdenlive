name: Kdenlive Windows Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Kdenlive target: 'master' (git HEAD), 'release' (latest tagged release) or a version such as 25.08.0"
        required: false
        default: "master"
      build_type:
        description: "Build type (RelWithDebInfo matches KDE's prebuilt binary cache; others rebuild every dependency from source and will not fit in the time limit)"
        required: false
        default: "RelWithDebInfo"
        type: choice
        options:
          - RelWithDebInfo
          - Release
          - Debug
      package:
        description: "Also create the Windows installer/archive"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 3 * * 0"   # weekly, Sunday 03:00 UTC

concurrency:
  group: kdenlive-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CRAFT_ROOT: C:\CraftRoot
  KD_TARGET: ${{ github.event.inputs.target || 'master' }}
  KD_BUILD_TYPE: ${{ github.event.inputs.build_type || 'RelWithDebInfo' }}
  KD_PACKAGE: ${{ github.event.inputs.package || 'true' }}
  PYTHONUTF8: "1"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  build:
    name: Kdenlive (Windows x64, MSVC 2022, KDE Craft)
    runs-on: windows-2022
    timeout-minutes: 345

    steps:
      - name: Prepare runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          Get-PSDrive C | Format-Table Name, Used, Free
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe")) {
            throw "vswhere.exe not found - Visual Studio is required by Craft's MSVC ABI"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      # invent.kde.org returns "403 Forbidden" to plain HTTP downloads from GitHub's
      # runners (it blocks scripted/non-browser clients), so we never download from it
      # over HTTP. Craft itself is cloned from KDE's official GitHub mirror and passed
      # to the bootstrap via --localDev.
      #
      # Craft later clones its blueprints and the Kdenlive source over git. If git
      # access to invent.kde.org works from this runner we leave it alone; if not, we
      # transparently redirect those clones to the matching GitHub mirrors.
      - name: Bootstrap Craft
        shell: pwsh
        run: |
          python -m pip install --upgrade certifi

          # --- git access check / mirror fallback -------------------------------------
          $ErrorActionPreference = 'Continue'
          git ls-remote https://invent.kde.org/packaging/craft-blueprints-kde.git HEAD *> $null
          $inventOk = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if ($inventOk) {
            Write-Host "invent.kde.org git access works - using it directly."
          } else {
            Write-Warning "invent.kde.org not reachable via git - redirecting clones to GitHub mirrors."
            git config --global url."https://github.com/KDE/craft".insteadOf       "https://invent.kde.org/packaging/craft"
            git config --global url."https://github.com/KDE/kdenlive".insteadOf    "https://invent.kde.org/multimedia/kdenlive"
            git config --global url."https://github.com/KDE/kshim".insteadOf       "https://invent.kde.org/sdk/kshim"
          }

          # --- get Craft from the GitHub mirror ---------------------------------------
          $craftSrc = Join-Path $env:RUNNER_TEMP "craft-src"
          git clone --depth 1 --branch master https://github.com/KDE/craft.git $craftSrc
          if ($LASTEXITCODE -ne 0) { throw "Could not clone https://github.com/KDE/craft.git" }

          # --- bootstrap (non-interactive) --------------------------------------------
          New-Item -ItemType Directory -Force -Path "$env:CRAFT_ROOT\download" | Out-Null
          python "$craftSrc\setup\CraftBootstrap.py" `
            --prefix "$env:CRAFT_ROOT" `
            --branch master `
            --localDev "$craftSrc" `
            --use-defaults
          if ($LASTEXITCODE -ne 0) { throw "Craft bootstrap failed ($LASTEXITCODE)" }

          $abi = (Select-String -Path "$env:CRAFT_ROOT\etc\CraftSettings.ini" -Pattern '^\s*ABI\s*=').Line
          Write-Host "Craft ABI -> $abi"
          if ($abi -notmatch 'msvc2022') { throw "Unexpected ABI: $abi" }

      # Craft master points at binary-cache version "26.10", which KDE has not published
      # yet (files.kde.org answers 404), so every dependency would be compiled from
      # source and the build would run out of time. This step probes the published cache
      # versions, newest first, and pins the first one that exists.
      - name: Select an available binary cache
        shell: pwsh
        run: |
          $ini = "$env:CRAFT_ROOT\etc\CraftSettings.ini"
          # Versions that exist on https://files.kde.org/craft/Qt6/ (newest first).
          $candidates = @("26.10", "26.05", "26.02")
          function Test-Manifest($v, $bt) {
            $url = "https://files.kde.org/craft/Qt6/$v/windows/cl/msvc2022/x86_64/$bt/manifest.json"
            curl.exe -s -f -L -I -o NUL $url
            $ok = ($LASTEXITCODE -eq 0)
            Write-Host ("  {0,-10} {1,-15} {2}" -f $v, $bt, $(if ($ok) { "found" } else { "missing" }))
            return $ok
          }
          $chosen = $null
          # Pass 1: a version that has BOTH RelWithDebInfo (Kdenlive + libs) and MinSizeRel (Craft's dev-utils).
          foreach ($v in $candidates) {
            if ((Test-Manifest $v "RelWithDebInfo") -and (Test-Manifest $v "MinSizeRel")) { $chosen = $v; break }
          }
          # Pass 2: a version with at least RelWithDebInfo.
          if (-not $chosen) {
            foreach ($v in $candidates) { if (Test-Manifest $v "RelWithDebInfo") { $chosen = $v; break } }
          }
          if (-not $chosen) {
            Write-Warning "No published binary cache found - dependencies will be built from source (very slow)."
          } else {
            $lines = [System.Collections.Generic.List[string]](Get-Content $ini)
            $idx = -1
            for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i].Trim() -eq '[Packager]') { $idx = $i; break } }
            if ($idx -ge 0) { $lines.Insert($idx + 1, "CacheVersion = $chosen") }
            else { $lines.Add(""); $lines.Add("[Packager]"); $lines.Add("CacheVersion = $chosen") }
            Set-Content -Path $ini -Value $lines
            Write-Host "Pinned CacheVersion = $chosen"
          }
          Get-Content $ini | Select-String -Pattern 'CacheVersion|RepositoryUrl|^\[Packager\]'

      - name: Build and package Kdenlive
        shell: pwsh
        run: |
          # craftenv.ps1 wipes and rebuilds the whole environment, so save what we need first.
          $root    = $env:CRAFT_ROOT
          $target  = $env:KD_TARGET
          $btype   = $env:KD_BUILD_TYPE
          $package = $env:KD_PACKAGE -eq 'true'
          $env:PATH = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:PATH"

          # craftenv.ps1 starts with `cls`, which throws on a non-interactive console.
          Remove-Item Alias:cls, Alias:clear -Force -ErrorAction SilentlyContinue
          function Global:cls {}
          function Global:clear {}
          function Global:Clear-Host {}

          . "$root\craft\craftenv.ps1"

          $opts = @("--ci-mode", "--output-on-failure", "--use-cache", "--buildtype", $btype)
          if ($target -ne "release") { $opts += "--target=$target" }

          craft @opts kdenlive
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "First attempt failed - retrying after building zlib (known Kdenlive/Craft quirk)"
            craft @opts zlib
            craft @opts kdenlive
          }
          if ($LASTEXITCODE -ne 0) { throw "craft kdenlive failed ($LASTEXITCODE)" }

          if ($package) {
            craft @opts --package kdenlive
            if ($LASTEXITCODE -ne 0) { throw "craft --package failed ($LASTEXITCODE)" }
          }

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $env:CRAFT_ROOT "bin\kdenlive.exe"
          if (-not (Test-Path $exe)) { throw "kdenlive.exe not found at $exe" }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime
          $melt = Join-Path $env:CRAFT_ROOT "bin\melt.exe"
          if (Test-Path $melt) { & $melt -version 2>&1 | Select-Object -First 3 }

      - name: Collect packages
        if: ${{ always() }}
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $ext = '.exe', '.7z', '.zip', '.appx', '.msix'
          # Craft's default package directory is <CraftRoot>\tmp; fall back to a wider search.
          $found = @()
          $tmp = Join-Path $env:CRAFT_ROOT "tmp"
          if (Test-Path $tmp) {
            $found = Get-ChildItem $tmp -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $ext -contains $_.Extension -and $_.Length -gt 1MB }
          }
          if (-not $found) {
            $found = Get-ChildItem $env:CRAFT_ROOT -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'kdenlive*' -and $ext -contains $_.Extension -and $_.Length -gt 1MB -and $_.FullName -notmatch '\\(build|download|bin|lib)\\' }
          }
          $found | ForEach-Object { Copy-Item $_.FullName $out -Force }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload packages
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-windows-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Craft logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-craft-logs-${{ github.run_number }}
          path: |
            C:\CraftRoot\etc\CraftSettings.ini
            C:\CraftRoot\logs\**
            C:\CraftRoot\build\**\*.log
          if-no-files-found: ignore
          retention-days: 7
