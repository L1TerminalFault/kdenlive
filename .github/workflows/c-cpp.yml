name: C/C++ CI - Windows Build

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-mlt
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-frei0r-plugins
            mingw-w64-x86_64-rttr
            mingw-w64-x86_64-kf6-kcoreaddons
            mingw-w64-x86_64-kf6-kxmlgui
            mingw-w64-x86_64-kf6-kwidgetsaddons
            mingw-w64-x86_64-kf6-karchive
            mingw-w64-x86_64-kf6-kconfig
            mingw-w64-x86_64-kf6-ki18n
            mingw-w64-x86_64-kf6-kio
            mingw-w64-x86_64-kf6-kiconthemes
            mingw-w64-x86_64-kf6-knotifications
            mingw-w64-x86_64-kf6-kdbusaddons

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Compile with Ninja
        shell: msys2 {0}
        run: |
          cd build
          ninja

      - name: Bundle and Deploy DLLs
        shell: msys2 {0}
        run: |
          mkdir release
          cp build/bin/kdenlive.exe release/
          windeployqt6 release/kdenlive.exe

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-windows-executable
          path: release/
